name: Evaluate Participant Submissions

on:
  push:
    paths:
      - "Submission-Milestone1/**"
      - "Submission-Milestone2/**"
      - "Submission-Milestone3/**"
      - "Submission-Milestone4/**"
      - "evaluator/**"
      - "problem_statements/**"
      - "rubrics/**"
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/evaluate-submissions.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: evaluate-submissions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Discover all tracked submissions
        id: submissions
        shell: bash
        run: |
          python scripts/find_submissions.py "" "${{ github.sha }}" > all_submissions.txt
          echo "All submissions selected for a complete milestone report:"
          cat all_submissions.txt
          if [ -s all_submissions.txt ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Evaluate all project/milestone submissions
        if: steps.submissions.outputs.found == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m evaluator.run_evaluations --files-from all_submissions.txt --output-dir evaluation-reports
      - name: Upload evaluation reports
        if: always() && steps.submissions.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports-${{ github.run_number }}
          path: evaluation-reports/
          if-no-files-found: warn
          retention-days: 90
