name: Evaluate Participant Submissions

# Runs automatically when a participant adds a file to any Submission-Milestone folder.
# Each submission is evaluated ONCE: results are stored in evaluation-results/results.json
# and committed back to the repo, so later runs skip anything already scored.
on:
  push:
    paths:
      - "Submission-Milestone1/**"
      - "Submission-Milestone2/**"
      - "Submission-Milestone3/**"
      - "Submission-Milestone4/**"
  workflow_dispatch:
    inputs:
      force_path:
        description: "Instructor override: re-evaluate this one submission path (e.g. Submission-Milestone1/Participant_M1_01_x.ipynb). Leave empty for normal run."
        required: false
        default: ""
      rebuild_only:
        description: "Only rebuild SCORES.md / Excel reports from saved results (no AI calls)"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # commit results back + post commit comments

# One run at a time. If several participants push together, the next run picks up
# every submission not yet in the ledger, so nothing is missed and nothing is scored twice.
concurrency:
  group: evaluate-submissions
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, used to record who submitted each file and when

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Evaluate new submissions only
        id: evaluate
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FORCE_PATH: ${{ github.event.inputs.force_path }}
          REBUILD_ONLY: ${{ github.event.inputs.rebuild_only }}
        run: |
          ARGS=()
          if [ "$REBUILD_ONLY" = "true" ]; then ARGS+=(--rebuild-only); fi
          if [ -n "$FORCE_PATH" ]; then ARGS+=(--force "$FORCE_PATH"); fi
          python -m evaluator.run_evaluations "${ARGS[@]}"

      - name: Commit results back to the repository
        if: always()
        run: |
          git config user.name  "ai-evaluator-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evaluation-results
          if git diff --cached --quiet; then
            echo "No result changes to commit."
            exit 0
          fi
          git commit -m "Evaluation results update [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --no-edit origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push failed (attempt $i), retrying..."; sleep $((i * 5))
          done
          echo "Could not push results after 5 attempts" >&2
          exit 1

      - name: Post score on each participant's commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const file = `${process.env.RUNNER_TEMP}/new_results.json`;
            if (!fs.existsSync(file)) return;
            const results = JSON.parse(fs.readFileSync(file, 'utf8'));
            const base = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${process.env.GITHUB_REF_NAME}`;
            for (const r of results) {
              if (!r.commit) continue;
              const body = [
                `### 🤖 AI Evaluation — ${r.participant}`,
                `**${r.milestone.replace('_', ' ')}** · ${r.project}`,
                ``,
                `## Score: ${r.total} / ${r.maximum}`,
                ``,
                `📄 Detailed feedback: ${base}/${r.feedback_file}`,
                `📊 All scores: ${base}/evaluation-results/SCORES.md`,
                ``,
                `_This submission has been evaluated once and the score is recorded. AI-generated; subject to instructor review._`
              ].join('\n');
              try {
                await github.rest.repos.createCommitComment({ ...context.repo, commit_sha: r.commit, body });
              } catch (e) { core.warning(`Could not comment on ${r.commit}: ${e.message}`); }
            }

      - name: Upload Excel reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evaluation-reports-${{ github.run_number }}
          path: evaluation-results/reports/
          if-no-files-found: ignore
          retention-days: 90
